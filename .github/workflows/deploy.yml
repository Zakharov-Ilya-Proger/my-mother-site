name: Deploy to Timeweb

on:
  push:
    branches: [frontend]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy .htaccess to build
        run: cp .htaccess build/.htaccess

      - name: Show build contents
        run: ls -la build/

      - name: Test FTP connection
        run: |
          echo "Testing FTP port 21..."
          nc -vz -w 10 "${{ secrets.FTP_SERVER }}" 21

      - name: Deploy build to Timeweb
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: build/
          server-dir: react-site/public_html/
          dangerous-clean-slate: true